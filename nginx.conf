# ============================================
# Elegant Blog - Nginx 配置
# ============================================
#
# 职责：
# 1. 提供 React 前端静态文件服务
# 2. 反向代理 /api/ 请求到后端 Express 服务
# 3. 代理 /uploads/ 请求到后端的上传文件目录
# 4. Gzip 压缩优化传输性能
# 5. 安全头（防点击劫持、XSS、MIME 嗅探）
# 6. SPA 路由回退（所有前端路由都返回 index.html）
#
# 生产环境 SSL 配置请参考 docs/DEPLOYMENT.md
# ============================================

server {
    listen 80;
    server_name localhost;

    # React 构建产物的根目录（由 Dockerfile.client 构建并复制到此）
    root /usr/share/nginx/html;
    index index.html;

    # ===== Gzip 压缩（减少传输体积，提升加载速度）=====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;        # 压缩级别（1-9，6 是性能与效果的平衡点）
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ===== 安全响应头 =====
    add_header X-Frame-Options "SAMEORIGIN" always;                    # 防止页面被嵌入 iframe（防点击劫持）
    add_header X-Content-Type-Options "nosniff" always;                # 防止浏览器 MIME 嗅探
    add_header X-XSS-Protection "1; mode=block" always;                # 启用浏览器 XSS 过滤
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 控制 Referer 头的发送策略

    # ===== API 反向代理 =====
    # 将 /api/ 开头的请求转发到后端 Express 服务（Docker 内部网络，服务名为 server）
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;              # WebSocket 支持
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;             # 传递客户端真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;          # 传递协议（http/https）
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ===== 上传文件代理 =====
    # 将 /uploads/ 请求转发到后端，设置 30 天浏览器缓存
    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 静态资源长缓存 =====
    # JS/CSS/图片等使用 1 年缓存（CRA 构建产物带内容哈希，文件变化会改变文件名）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===== React SPA 路由回退 =====
    # 所有非静态资源的请求都返回 index.html，由前端 React Router 处理路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 健康检查端点 =====
    # 供监控系统和负载均衡器检测 Nginx 是否存活
    location /health {
        access_log off;          # 不记录健康检查请求到访问日志
        default_type text/plain; # 必须在 return 之前设置，否则不生效
        return 200 "healthy\n";
    }
}
